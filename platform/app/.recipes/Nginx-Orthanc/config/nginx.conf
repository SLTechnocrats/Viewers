worker_processes 2;
error_log /var/logs/nginx/mydomain.error.log;
pid /var/run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include '/etc/nginx/mime.types';
  default_type application/octet-stream;

  keepalive_timeout 65;
  keepalive_requests 100000;
  tcp_nopush on;
  tcp_nodelay on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_comp_level 9;
  etag on;

  ##
  # Redirect HTTP to HTTPS
  ##
  server {
    listen 80;
    listen [::]:80;
    server_name dev.pacs.sltechnocrats.click;

    return 301 https://$host$request_uri;
  }

  ##
  # HTTPS Server
  ##
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.pacs.sltechnocrats.click;

    ssl_certificate /etc/letsencrypt/live/dev.pacs.sltechnocrats.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.pacs.sltechnocrats.click/privkey.pem;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    ##
    # Reverse Proxy for Orthanc APIs
    ##
    location /pacs-smaro/ {
      client_max_body_size 2G;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      expires 0;
      add_header Cache-Control private;
      add_header 'Access-Control-Allow-Origin' '*' always;

      proxy_pass http://orthanc:8042/;
    }

    ##
    # No cache for service worker
    ##
    location /sw.js {
      add_header Cache-Control "no-cache";
      proxy_cache_bypass $http_pragma;
      proxy_cache_revalidate on;
      expires off;
      access_log off;
    }

    ##
    # Serve the SPA
    ##
    location / {
      root /var/www/html;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
  }
}
