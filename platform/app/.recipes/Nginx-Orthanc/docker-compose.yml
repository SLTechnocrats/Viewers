version: '3.8'

services:
  # OHIF Viewer + NGINX reverse proxy
  ohif_viewer:
    build:
      context: ./../../../../
      dockerfile: ./platform/app/.recipes/Nginx-Orthanc/dockerfile
    image: webapp:latest
    container_name: ohif_orthanc
    volumes:
      # NGINX config
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro

      # NGINX logs
      - ./logs/nginx:/var/logs/nginx

      # Let's Encrypt certificate (SSL cert)
      - /var/lib/orthanc/db-v6:/var/lib/orthanc/db-v6:ro
      - /etc/letsencrypt/live/smaro.app:/etc/letsencrypt/live/smaro.app:ro
      - /etc/letsencrypt/archive/smaro.app:/etc/letsencrypt/archive/smaro.app:ro
      - /etc/letsencrypt/privkey.pem:/etc/letsencrypt/privkey.pem:ro

    ports:
      - "80:80"   # HTTP (for redirect)
      - "443:443" # HTTPS (with SSL)
    depends_on:
      - orthanc
    restart: on-failure

  # Orthanc PACS
  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthancPACS
    volumes:
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./volumes/orthanc-db/:/var/lib/orthanc/db/
    ports:
      - "4242:4242"
      - "8042:8042"
    restart: unless-stopped
